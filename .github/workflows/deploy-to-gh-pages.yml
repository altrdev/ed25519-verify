name: Build and Deploy

# Publishes the site on GitHub Pages. It is not run by pushes to main any more: the site is what a release ships.
#  - the Release workflow calls it with the version it has just created;
#  - by hand (Actions → Build and Deploy → Run workflow) it publishes the chosen branch as "main-<commit>", for an emergency or a test.
on:
  workflow_call:
    inputs:
      version:
        description: The version of the release being published (e.g. 2.6.0)
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer one waits for the running one and never cancels it
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node ⚙️
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install 📦
        run: npm ci

      - name: Build 🔧
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          # the version shown in the footer: the release, or for a manual deploy "<branch>-<commit>"
          version="$RELEASE_VERSION"
          if [ -z "$version" ]; then version="${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}"; fi
          echo "Building version $version"
          APP_VERSION="$version" npm run build

      - name: Upload artifact 📤
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy 🚀
        id: deployment
        uses: actions/deploy-pages@v5
