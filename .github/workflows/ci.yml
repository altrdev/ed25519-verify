name: CI

# Runs the same checks as the deploy pipeline on every pull request, so a broken change is caught before it is merged.
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# a new push to the same pull request replaces the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Node ⚙️
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install 📦
        run: npm ci

      - name: Lint and format 🧹
        run: npm run lint

      - name: Type-check 🔎
        run: npm run typecheck

      - name: Test 🧬
        run: npm test

      - name: Build 🔧
        run: npm run build

      - name: Check the Content-Security-Policy is in the build 🔒
        run: grep -q 'http-equiv="Content-Security-Policy"' dist/index.html

      - name: Install the browser for the end-to-end tests 🌐
        run: npx playwright install --with-deps chromium

      - name: End-to-end and accessibility tests 🧪
        run: npm run test:e2e

      - name: Keep the report of a failed run 📎
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
