version: 2

updates:
  # npm dependencies (package.json / package-lock.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "[chore]"
    groups:
      # minor and patch updates arrive together in one pull request; majors stay separate for a closer look
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  # versions of the actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "[chore]"
    groups:
      actions:
        patterns:
          - "*"

  # the reference tools of the fixtures (scripts/requirements.txt): pycose is pinned, a new version is looked at
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    commit-message:
      prefix: "[chore]"
